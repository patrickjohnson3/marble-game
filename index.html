<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101114" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/marble-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/marble-maskable.svg" />
    <link rel="preload" href="assets/sprites/cheerio.png" as="image" />
    <link rel="preload" href="assets/sprites/sponge.png" as="image" />
    <link rel="preload" href="assets/sprites/spoon.png" as="image" />
    <title>marble tilt</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101114;
        color: white;
      }
      #game {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #101114;
      }
      #settingsOverlay,
      #messageOverlay {
        display: none;
      }
      #bootError:not([hidden]) {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 16px;
        overflow: auto;
        padding: 24px;
        background: #101114;
        color: white;
        font:
          600 16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      #retryBoot {
        min-height: 44px;
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: white;
        color: #111;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <script>
      const assetVersion = "95d9d91e717e7c6d";
      const runtimeModuleScripts = [
        "app.js",
        "boot.js",
        "core/copy.js",
        "core/cockroach.js",
        "core/debug.js",
        "core/dom.js",
        "core/frame-loop.js",
        "core/goal-controller.js",
        "core/game-lifecycle.js",
        "core/game-loop.js",
        "core/geometry.js",
        "core/game-config.js",
        "core/haptics.js",
        "core/intro-sequence.js",
        "core/kitchen-dynamics.js",
        "core/map-bounds.js",
        "core/map-config.js",
        "core/map-elements.js",
        "core/map-obstacles.js",
        "core/map-objectives.js",
        "core/map-progression.js",
        "core/map-runtime.js",
        "core/map-variants.js",
        "core/mouse.js",
        "core/physics-collisions.js",
        "core/physics.js",
        "core/rect-bounds.js",
        "core/runtime-states.js",
        "core/state.js",
        "input/input-manager.js",
        "input/camera-controller.js",
        "input/camera-gestures.js",
        "input/keyboard-controller.js",
        "input/sensor-controller.js",
        "input/sensor-watchdog.js",
        "maps/map-data.js",
        "maps/map-authoring.js",
        "maps/kitchen-floor.js",
        "maps/kitchen-breakfast.js",
        "maps/living-room.js",
        "maps/parking-lot.js",
        "maps/kitchen-layout.js",
        "platform/platform.js",
        "rendering/effects.js",
        "rendering/cockroach-rendering.js",
        "rendering/goo-patch-rendering.js",
        "rendering/hazard-patch-rendering.js",
        "rendering/liquid-patch-shape.js",
        "rendering/kitchen-floor-details.js",
        "rendering/map-renderer.js",
        "rendering/map-theme-rendering.js",
        "rendering/living-room-rendering.js",
        "rendering/parking-lot-rendering.js",
        "rendering/marble-view.js",
        "rendering/mouse-rendering.js",
        "rendering/ice-patch-rendering.js",
        "rendering/obstacle-rendering.js",
        "rendering/rough-patch-rendering.js",
        "rendering/trail.js",
        "rendering/wall-rendering.js",
        "rendering/water-patch-rendering.js",
        "rendering/ui.js",
        "settings/settings-config.js",
        "settings/settings-panel.js",
        "settings/settings-store.js",
      ];
      const importMapScript = document.createElement("script");
      importMapScript.type = "importmap";
      importMapScript.textContent = JSON.stringify({
        imports: Object.fromEntries(
          runtimeModuleScripts.map((script) => [
            "./" + script,
            "./" + script + "?v=" + assetVersion,
          ]),
        ),
      });
      document.head.appendChild(importMapScript);

      window.__marbleAppBooted = false;
      window.__showMarbleBootError = function (error) {
        if (window.__marbleAppBooted) return;
        const bootErrorEl = document.getElementById("bootError");
        if (bootErrorEl) {
          bootErrorEl.hidden = false;
          document.getElementById("retryBoot").focus();
        }
        if (error) console.error(error);
      };
      window.addEventListener("error", function (event) {
        window.__showMarbleBootError(event.error || event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        window.__showMarbleBootError(event.reason);
      });

      const appStylesheet = document.createElement("link");
      appStylesheet.rel = "stylesheet";
      appStylesheet.href = "style.css?v=" + assetVersion;
      const appStylesReady = new Promise((resolve) => {
        appStylesheet.addEventListener("load", () => resolve(true));
        appStylesheet.addEventListener("error", () => resolve(false));
        document.head.appendChild(appStylesheet);
      });
    </script>
  </head>
  <body>
    <div id="bootError" role="alert" hidden>
      <p id="bootErrorMessage">game failed to load. reconnect and try again.</p>
      <button id="retryBoot" type="button">Retry</button>
    </div>
    <div id="game">
      <div id="world">
        <div id="introWalls" class="walls"></div>
        <div id="mapWalls" class="walls"></div>
        <div id="mapTheme"></div>
        <div id="gooPatches"></div>
        <div id="hazardPatches"></div>
        <div id="icePatches"></div>
        <div id="roughPatches"></div>
        <div id="waterPatches"></div>
        <div id="obstacles"></div>
        <div id="hitboxes"></div>
        <div id="mapThemeOverlay"></div>
        <div id="goal" aria-hidden="true"></div>
        <svg id="trail" aria-hidden="true"><g id="trailSegments"></g></svg>
        <div id="effects" aria-hidden="true"></div>
        <div id="marble"></div>
      </div>
    </div>

    <div id="goalIndicator" aria-hidden="true"></div>

    <div id="messageOverlay" aria-live="polite"></div>

    <div id="gameStatus" role="status" aria-live="polite"></div>

    <div id="panel">
      <div id="levelLabel" role="status" aria-live="polite"></div>
      <div id="objectiveStatus" role="status" aria-live="polite"></div>
      <button id="nextRoom" type="button" hidden></button>
      <div id="fpsCounter" hidden></div>
      <div id="debug" hidden></div>
    </div>

    <button id="settingsToggle" aria-label="" title="">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M19.4 13.5c.1-.5.1-1 .1-1.5s0-1-.1-1.5l2-1.5-2-3.5-2.4 1a8 8 0 0 0-2.6-1.5L14 2h-4l-.4 3a8 8 0 0 0-2.6 1.5l-2.4-1-2 3.5 2 1.5a9.7 9.7 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 2.6 1.5l.4 3h4l.4-3a8 8 0 0 0 2.6-1.5l2.4 1 2-3.5-2-1.5Z"
        />
        <circle cx="12" cy="12" r="3.2" />
      </svg>
    </button>

    <div id="controls">
      <p id="startHelp" tabindex="0"></p>
      <button id="start" aria-describedby="startHelp"></button>
    </div>

    <details id="cameraControls" hidden>
      <summary id="cameraControlsTitle"></summary>
      <div class="cameraButtons">
        <button id="zoomOut" type="button" class="secondary"></button>
        <button id="zoomIn" type="button" class="secondary"></button>
        <button id="centerCamera" type="button" class="secondary"></button>
        <button id="cameraLeft" type="button" class="secondary"></button>
        <button id="cameraUp" type="button" class="secondary"></button>
        <button id="cameraDown" type="button" class="secondary"></button>
        <button id="cameraRight" type="button" class="secondary"></button>
      </div>
    </details>

    <dialog id="settingsOverlay" aria-labelledby="settingsTitle">
      <div id="settingsModal">
        <div id="settingsHeader">
          <h2 id="settingsTitle"></h2>
          <button id="closeSettings" aria-label="" autofocus></button>
        </div>
        <div id="pwaStatus" class="settingsStatus" aria-live="polite"></div>
        <details class="settingsHelp">
          <summary id="controlsHelpTitle"></summary>
          <div class="settingsHelpContent">
            <p id="movementHelp"></p>
            <p id="cameraHelp"></p>
            <p id="goalHelp"></p>
            <div id="mapObjectsStatus" class="settingsStatus"></div>
            <div id="hint" class="settingsStatus" aria-live="polite"></div>
          </div>
        </details>
        <section
          class="settingsSection"
          aria-labelledby="gameplaySettingsTitle"
        >
          <h3 id="gameplaySettingsTitle"></h3>
          <div class="rangeSetting">
            <div class="rangeSettingHeader">
              <label for="speedSetting"><span></span></label>
              <output id="speedSettingValue" for="speedSetting"></output>
            </div>
            <input id="speedSetting" type="range" />
            <div class="rangeSettingScale">
              <span>low</span>
              <button id="resetSpeedSetting" type="button"></button>
              <span>high</span>
            </div>
          </div>
          <div class="rangeSetting">
            <div class="rangeSettingHeader">
              <label for="sensitivitySetting"><span></span></label>
              <output
                id="sensitivitySettingValue"
                for="sensitivitySetting"
              ></output>
            </div>
            <input id="sensitivitySetting" type="range" />
            <div class="rangeSettingScale">
              <span>low</span>
              <button id="resetSensitivitySetting" type="button"></button>
              <span>high</span>
            </div>
          </div>
          <label class="settingRow checkboxRow" for="hapticsSetting">
            <span></span>
            <input id="hapticsSetting" type="checkbox" />
          </label>
          <label class="settingRow checkboxRow" for="trailSetting">
            <span></span>
            <input id="trailSetting" type="checkbox" />
          </label>
          <label class="settingRow checkboxRow" for="goalIndicatorSetting">
            <span></span>
            <input id="goalIndicatorSetting" type="checkbox" />
          </label>
        </section>
        <section class="settingsSection" aria-labelledby="deviceSettingsTitle">
          <h3 id="deviceSettingsTitle"></h3>
          <button id="installApp" class="secondary" hidden></button>
          <button id="neutral" class="secondary"></button>
          <div id="motionRecovery" hidden>
            <p id="motionRecoveryHelp" class="settingsStatus"></p>
            <button
              id="retryMotion"
              class="secondary"
              aria-describedby="motionRecoveryHelp"
            ></button>
          </div>
          <label class="settingRow checkboxRow" for="fullscreenSetting">
            <span></span>
            <input id="fullscreenSetting" type="checkbox" />
          </label>
        </section>
        <details class="settingsSection diagnosticsSettings">
          <summary id="diagnosticsSettingsTitle"></summary>
          <label class="settingRow" for="mapSelect">
            <span></span>
            <select
              id="mapSelect"
              aria-describedby="mapSwitchHelp"
              disabled
            ></select>
          </label>
          <p id="mapSwitchHelp" class="settingsStatus"></p>
          <button id="loadMap" class="secondary" disabled></button>
          <label class="settingRow checkboxRow" for="hitboxOverlaySetting">
            <span></span>
            <input id="hitboxOverlaySetting" type="checkbox" />
          </label>
          <label class="settingRow checkboxRow" for="fpsSetting">
            <span></span>
            <input id="fpsSetting" type="checkbox" />
          </label>
          <label class="settingRow checkboxRow" for="statsSetting">
            <span></span>
            <input id="statsSetting" type="checkbox" />
          </label>
        </details>
        <div class="settingsActions">
          <button id="retryMap" class="secondary"></button>
          <button id="resumeGame" class="primaryAction"></button>
        </div>
      </div>
    </dialog>

    <script>
      document.getElementById("retryBoot").addEventListener("click", () => {
        window.location.reload();
      });
      appStylesReady.then((loaded) => {
        if (!loaded) {
          window.__showMarbleBootError(
            new Error("Game stylesheet failed to load"),
          );
          return;
        }
        const appScript = document.createElement("script");
        appScript.type = "module";
        appScript.src = "boot.js?v=" + assetVersion;
        appScript.addEventListener("error", function (event) {
          window.__showMarbleBootError(event);
        });
        document.body.appendChild(appScript);
      });
    </script>
  </body>
</html>
